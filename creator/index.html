<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursor Skin Theme Creator</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>Cursor Skin Theme Creator</h1>
        <p class="sub">Theme Schema 可视化编辑 · 与 Validator 共用同一套契约</p>
      </div>
      <div class="top-actions">
        <label class="btn ghost">
          导入 ZIP
          <input id="import-zip" type="file" accept=".zip,application/zip" hidden />
        </label>
        <button id="btn-validate" type="button" class="btn">校验</button>
        <button id="btn-export" type="button" class="btn primary">导出 Theme ZIP</button>
      </div>
    </header>

    <main class="layout">
      <section class="editor" aria-label="Theme fields">
        <fieldset>
          <legend>Theme</legend>
          <label>名称 <input id="name" type="text" autocomplete="off" /></label>
          <label>ID <input id="id" type="text" autocomplete="off" spellcheck="false" /></label>
          <label>作者 <input id="author" type="text" autocomplete="off" /></label>
          <label>版本 <input id="version" type="text" autocomplete="off" /></label>
          <label class="full">描述 <textarea id="description" rows="2"></textarea></label>
        </fieldset>

        <fieldset>
          <legend>Wallpaper</legend>
          <label class="full file">
            壁纸（PNG / JPG / WebP / MP4 / WebM）
            <input id="wallpaper" type="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm" />
          </label>
          <p id="wallpaper-name" class="hint"></p>
          <label class="full file">
            预览图（视频壁纸需要；静图可与壁纸同一张）
            <input id="preview" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
          </label>
          <p id="preview-name" class="hint"></p>
          <div class="row">
            <label>基调
              <select id="scheme">
                <option value="dark">dark</option>
                <option value="light">light</option>
              </select>
            </label>
            <label>Base theme
              <select id="baseTheme">
                <option>Cursor Dark</option>
                <option>Cursor Light</option>
                <option>Cursor Dark High Contrast</option>
              </select>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Frost</legend>
          <label class="check"><input id="frost-enabled" type="checkbox" /> 启用霜化</label>
          <label>Opacity <span id="frost-opacity-val" class="val"></span>
            <input id="frost-opacity" type="range" min="0" max="100" />
          </label>
          <label>Blur <span id="frost-blur-val" class="val"></span>
            <input id="frost-blur" type="range" min="0" max="64" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Workspace</legend>
          <p class="hint">每个区域：透明度（0–1）。雾感跟 Schema 走，可后调。</p>
          <div id="workspace-mount"></div>
        </fieldset>

        <fieldset>
          <legend>Performance</legend>
          <div id="tier-mount" class="tiers"></div>
        </fieldset>

        <fieldset>
          <legend>官方示例</legend>
          <div class="row">
            <select id="example"></select>
            <button id="btn-example" type="button" class="btn">载入</button>
          </div>
        </fieldset>
      </section>

      <section class="preview-col" aria-label="Preview">
        <div class="preview-head">
          <span>Preview</span>
          <span id="preview-title" class="muted"></span>
        </div>
        <div id="stage" class="stage" data-scheme="dark">
          <div id="wall" class="wall"></div>
          <div class="workbench">
            <div class="titlebar" data-chrome>Cursor Skin</div>
            <div class="cols">
              <aside class="pane" data-region="sidebar">Sidebar</aside>
              <div class="mid">
                <section class="pane" data-region="editor">Editor</section>
                <section class="pane chat" data-region="chat">Chat</section>
              </div>
              <aside class="pane" data-region="auxiliary">Right</aside>
            </div>
            <div class="pane terminal" data-region="terminal">Terminal</div>
          </div>
        </div>
        <pre id="json-out" class="json" spellcheck="false"></pre>
      </section>
    </main>

    <footer class="bar">
      <pre id="report" class="report">尚未校验。导出前会再跑一遍 Validator。</pre>
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
